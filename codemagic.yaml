workflows:
  ios-release:
    name: iOS Release IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AuraNexus ios build key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.skytelehealth.app

      vars:
        BUNDLE_ID: "com.skytelehealth.app"

    scripts:
      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter build
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configure Xcode signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

      - name: Verify IPA output
        script: |
          echo "==== IPA CHECK ===="
          find build/ios/ipa -maxdepth 1 -type f -print || true
          ls -lah build/ios/ipa || true
          echo "==== END IPA CHECK ===="

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.plist
      - build/ios/ipa/Packaging.log
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Client Testers
