workflows:
  ios-release:
    name: iOS Release IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AuraNexus ios build key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.skytelehealth.app

    scripts:
      - name: Disable Flutter Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configure iOS code signing
        script: xcode-project use-profiles

      - name: Set up code signing
        script: xcode-project use-profiles  

      - name: Build iOS IPA
        script: flutter build ipa --release --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
